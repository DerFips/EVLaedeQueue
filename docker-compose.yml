services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ev-ladeplatz-api:latest
    container_name: ev-ladeplatz-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ladeplatz-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ladeplatz-net

volumes:
  ladeplatz-data:
    driver: local

networks:
  ladeplatz-net:
    driver: bridge
